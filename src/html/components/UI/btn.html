<button class="btn @@btnClass @@btnMode" @@dataPopupType="@@popupType"  type="@@type">
  <div class="btn__wrapper">
    <div class="btn__text">
      <p class="btn__text-p">@@btnText</p>
    </div>
    <div class="btn__icon">
      <svg
        class="btn__svg"
        width="12"
        height="12"
        viewBox="0 0 12 12"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          class="btn__svg-path"
          d="M1 1H11M11 1V11M11 1L1 11"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>
</button>
